# Python lint for CI (ruff). Each rule set here is a class of mistake an agent or a person
# made once; when a review corrects a new code pattern, add its rule here (AGENTS.md,
# "Corrections become checks"). Run: ruff check .   (ruff 0.17.6 in CI)
target-version = "py312"
extend-exclude = ["dashboard", ".github/skills", "docs/vendor"]

[lint]
select = [
  "E4", "E7", "E9",  # pycodestyle errors: imports, statements, syntax
  "F",               # pyflakes: unused names, undefined names
  "B",               # bugbear: likely bugs (silent zip truncation, lost exception cause)
  "UP",              # pyupgrade: one modern spelling for the same thing
  "I",               # import order
  "RUF100",          # a noqa that silences nothing
]
ignore = [
  "E731",            # a named lambda is fine for a one-line key or fake
  "E741",            # `l` for a line is the house style
]
# noqa comments do not count: CI and the gate run `ruff check --ignore-noqa .` (AGENTS.md)

[lint.per-file-ignores]
# these put scripts/ (or server/) on sys.path before they import from it
"tests/*.py" = ["E402"]
"server/app.py" = ["E402"]
