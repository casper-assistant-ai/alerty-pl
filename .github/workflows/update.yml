name: Update data

# Every 30 minutes: read gov.pl/web/rcb/komunikaty, rebuild docs/data (archive, history, analytics), deploy the site.
# Live alerts no longer wait for this: the live service (server/, casper-infra deploy/alerty-api) polls gov.pl every
# 20 s and streams them to open pages, Telegram, e-mail and Web Push. docs/data stays the fallback and the archive.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    # its own data commits (pushed with a deploy key, so they do start workflows) do not start it again
    paths: ["docs/**", "!docs/data/**", "scripts/**", "tests/**", ".github/workflows/update.yml"]

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write
  issues: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the changelog reads the whole history and the version tags
          # the ruleset "CodeQL: no new alerts" refuses direct pushes to main except by admins and deploy
          # keys: the data commit goes with the deploy key UPDATE_DEPLOY_KEY (write, used only here)
          ssh-key: ${{ secrets.UPDATE_DEPLOY_KEY }}
      - name: Tests
        run: python3 -I -m unittest discover -s tests -v
      - name: Scrape RCB
        id: scrape
        run: python3 -I scripts/rcb.py update --pages 3
      - name: Release and changelog (semver from Conventional Commits)
        run: |
          git config user.name "alerty-pl bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tag=$(python3 -I scripts/changelog.py release | grep '^v' || true)
          if [ -n "$tag" ]; then git push origin "$tag"; echo "released $tag"; fi
          python3 -I scripts/changelog.py build
      - name: Commit data when alerts changed
        run: |
          git config user.name "alerty-pl bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/alerts.json docs/data/archive.json docs/data/unmatched.json docs/data/changelog.json CHANGELOG.md
          if ! git diff --cached --quiet; then
            git add docs/data/meta.json
            msg=$(python3 -I -c 'import json;m=json.load(open("docs/data/meta.json"));print("chore(data):",m["active"],"active,",m["count"],"alerts")')
            git commit -m "$msg"
            git pull --rebase --autostash -X theirs origin main
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Retry deploy (artifact listing can lag a few seconds)
        if: steps.deploy.outcome == 'failure'
        run: sleep 20
      - id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
      - name: Check the live site after a deploy of new code
        if: github.event_name != 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site-check.yml || true
      - name: Call the parser doctor on failure
        if: failure() && steps.scrape.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # One doctor run per day at most: skip when an open parser issue or PR exists.
          open=$(gh pr list --search 'in:title "[parser-doctor]"' --json number --jq length)
          if [ "$open" = "0" ]; then gh workflow run parser-doctor.lock.yml || true; fi
