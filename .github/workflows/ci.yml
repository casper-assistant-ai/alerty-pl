name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # agent PRs carry a "[agent-name] " prefix; the squash subject is the rest
            python3 -I scripts/changelog.py lint --title "$(printf '%s' "$TITLE" | sed -E 's/^\[[a-z0-9-]+\] //')"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
              && git merge-base --is-ancestor "$BEFORE" HEAD 2>/dev/null; then
            python3 -I scripts/changelog.py lint "$BEFORE..${{ github.sha }}"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            # a forced push (history rewrite): the old tip is gone, lint the last commit only
            python3 -I scripts/changelog.py lint "HEAD~1..HEAD"
          fi
      - name: Unit tests on saved RCB pages
        run: python3 -I -m unittest discover -s tests -v
      - name: Live smoke test (gov.pl list page parses)
        run: python3 -I scripts/rcb.py update --pages 1 --out /tmp/smoke && python3 -I -c "import json;d=json.load(open('/tmp/smoke/alerts.json'));assert d['alerts'],'no alerts';print(len(d['alerts']),'alerts')"
      - name: JavaScript syntax
        run: for f in docs/*.js; do node --check "$f"; done
      - name: Python lint (ruff, rules in ruff.toml)
        run: pipx run ruff==0.17.6 check --output-format=github .
      - name: JavaScript lint (ESLint, rules in eslint.config.mjs)
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund eslint@10.15.0 @eslint/js@10.0.1 globals@17.14.0
          npx --no-install eslint .
      - name: "Node tests (every tests/*.test.mjs: common.js helpers, phone CSS rules, map period)"
        run: node --test tests/*.test.mjs
      - name: HTML pages are valid (html-validate, structural rules in .htmlvalidate.json)
        run: npx --yes html-validate@9.7.1 --config .htmlvalidate.json docs/*.html && python3 -I scripts/html_check.py
      - name: Live service starts (server/, deployed by casper-infra deploy/alerty-api)
        run: |
          python3 -m venv /tmp/venv && /tmp/venv/bin/pip install -q -r server/requirements.txt
          STATE_DIR=/tmp/live PORT=8099 POLL_SECONDS=600 timeout 20 /tmp/venv/bin/python -I server/app.py & sleep 8
          curl -fsS http://127.0.0.1:8099/config && curl -fsS -o /dev/null http://127.0.0.1:8099/alerts

  doctor:
    # a failed pull request run of this repository starts the CI doctor (fork PRs have a
    # read-only token and cannot; main is watched by the doctor's own workflow_run trigger)
    needs: test
    # Dependabot's runs get a read-only token and could not dispatch the doctor
    if: failure() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dispatch the CI doctor
        run: gh workflow run ci-doctor.lock.yml -R "$GITHUB_REPOSITORY" -f run_id="$GITHUB_RUN_ID"
