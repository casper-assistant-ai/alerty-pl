name: Agent dispatch

# Starts the extra agent runs that the process-retro agent planned in process/schedule.json
# (on top of each agent's own schedule). scripts/retro.py dispatch validates the plan: only
# agentic workflows of this repository, at most 3 extra runs per agent per week.
on:
  schedule:
    - cron: "5 7 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List the runs without starting them"
        type: boolean
        default: true

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Start today's extra runs
        run: python3 -I scripts/retro.py dispatch ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '--dry-run' || '' }}
