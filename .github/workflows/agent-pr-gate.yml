name: Agent PR gate

# No humans in the loop: agent PRs are merged or closed by this gate, never left for a person.
# A PR is merged only when (1) a gh-aw agent opened it, (2) it touches allowed paths only,
# (3) unit tests, a live parse of gov.pl, node --check, html-validate, ruff and ESLint pass on its head, and CodeQL
# found no new alert on it, (4) it merges into main
# cleanly, and (5) the PR reviewer agent approved that same head in a PR review (never a comment;
# scripts/gate_rules.py). When (2), (3) or (4) fails, or the
# reviewer says "Verdict: changes", the gate asks the PR fixer agent to fix the PR in its own branch
# ("Agent PR gate: fix attempt k of 3", with the reason and the test log) and tests the new head
# again. It closes a PR only when the reviewer rejects it on substance, the fixer finds it cannot be
# fixed, or three fix attempts did not help; then it tells the linked issues and starts the
# issue-worker, which takes them again (and gives up after two closed PRs).
#
# The owner's own PRs (authors in OWNERS, not drafts) and Dependabot's PRs go through the same
# pipeline (owner's wish, 2026-11-25): the gate puts the label "pipeline" on every PR it takes, and
# the reviewer and the fixer work only on PRs with that label. Differences: a Dependabot PR may
# change only server/requirements*.txt; an owner PR may change anything except .github/workflows/
# (GITHUB_TOKEN cannot merge those); a PR that changes server/ must also start the live service.
# The gate never closes an owner PR: where it would close one, it comments "Agent PR gate: stopped"
# with the reason and adds the label "gate-stopped"; removing the label hands the PR back to the
# gate with three new fix attempts.
on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_run:
    workflows: ["PR reviewer", "PR fixer"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write
  issues: write
  checks: read
  security-events: read

concurrency:
  group: agent-pr-gate

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      # ruff.toml, eslint.config.mjs and codeql/ are where a correction becomes a check (AGENTS.md)
      ALLOWED: '^(scripts/|tests/|codeql/|process/[a-z0-9-]+\.(md|json)$|docs/[a-z0-9-]+\.(html|js|css)$|README\.md$|AGENTS\.md$|ruff\.toml$|eslint\.config\.mjs$)'
      RUFF: ruff==0.17.6
      ESLINT: eslint@10.15.0 @eslint/js@10.0.1 globals@17.14.0
      SECURITY_ALLOWED: '^dashboard/'
      DEPENDABOT_ALLOWED: '^server/requirements[a-z0-9-]*\.txt$'
      OWNER_FORBIDDEN: '^\.github/workflows/'
      # GitHub logins whose PRs the pipeline takes: the owner (kloba) and Casper (casper-assistant-ai)
      OWNERS: 'kloba casper-assistant-ai'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge or close agent PRs
        run: |
          set -u
          git config user.name "alerty-pl bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          MAX_FIX=3
          busy() { gh run list --workflow "$1" --limit 10 --json status --jq '[.[] | select(.status != "completed")] | length'; }
          # A provider outage (z.ai 529, or 429 [1308] «Usage limit reached») ends a run at its first turns: on
          # 2026-11-25 one gate run started 6 PR fixers and 5 PR reviewers in 48 minutes, each dead in 3 minutes.
          # When the last two runs of a workflow failed in under 8 minutes each and the newer ended less than an
          # hour ago, the provider refused them: the gate starts no other. An hour after that failure it tries
          # again, so an outage costs at most two dead runs an hour per agent, and the gate never stays shut
          # (#138, the PR reviewer's change on #145).
          refused() {  # $1: a workflow file; prints 1 when its last two runs each failed in under 8 minutes, the newer within the hour
            gh run list --workflow "$1" --limit 2 --json conclusion,createdAt,updatedAt --jq '
              if length == 2 and all(.[]; .conclusion == "failure"
                and ((.updatedAt | fromdateiso8601) - (.createdAt | fromdateiso8601)) < 480)
                and (now - (.[0].updatedAt | fromdateiso8601)) < 3600 then 1 else 0 end' 2>/dev/null || echo 0
          }
          bot='.user.login=="github-actions[bot]"'
          stop_pr() {  # an owner PR is never closed: hand it back with the reason
            gh pr comment "$n" --body "Agent PR gate: stopped. $1 Over to you: push a change to this branch, then remove the label gate-stopped and the gate takes the PR again." \
              && gh pr edit "$n" --add-label gate-stopped >/dev/null && echo "stopped #$n: $1"
          }
          close_pr() {  # $1: the reason, quoted on the PR and on its linked issues
            local closes
            if [ "$kind" = owner ]; then stop_pr "$1"; return; fi
            closes=$(gh pr view "$n" --json closingIssuesReferences --jq '.closingIssuesReferences[].number')
            gh pr close "$n" --delete-branch --comment "Agent PR gate: closed without merging. $1" && echo "closed #$n: $1"
            for i in $closes; do
              gh issue comment "$i" --body "Agent PR gate: #$n was closed without merging. $1 The issue-worker takes this issue again."
            done
            [ "$kind" = agent ] && requeue=1
            return 0
          }
          request_fix() {  # $1: the reason; $2: a log file whose end goes into the request
            local k body
            if [ "$nofix" -gt 0 ]; then
              close_pr "$1 The PR fixer found it cannot be fixed in this branch: ${nofix_cause:-see its comment}"; return
            fi
            if [ "$attempts" -ge "$MAX_FIX" ]; then
              close_pr "$1 It still fails after $MAX_FIX fix attempts by the PR fixer."; return
            fi
            k=$((attempts + 1))
            body="/tmp/fix-$n.md"
            { echo "Agent PR gate: fix attempt $k of $MAX_FIX"
              echo "Fix-Head: $sha"
              echo
              echo "Reason: $1"
              echo
              echo "The PR fixer agent fixes this in the PR's own branch; the gate then tests the new head again."
              if [ -n "${2:-}" ] && [ -s "$2" ]; then
                echo; echo "<details><summary>end of the log</summary>"; echo; echo '```text'
                tail -n 60 "$2" | sed 's/```/` ` `/g'; echo '```'; echo; echo "</details>"
              fi
            } > "$body"
            gh pr comment "$n" --body-file "$body" && echo "fix attempt $k requested for #$n: $1"
            need_fix=1
          }
          live_check() {  # install server/requirements.txt in a fresh venv, start the service, ask it twice
            local pid rc=1
            python3 -m venv "/tmp/venv-$n" && "/tmp/venv-$n/bin/pip" install -q -r server/requirements.txt || return 1
            STATE_DIR="/tmp/live-$n" PORT=8099 POLL_SECONDS=600 "/tmp/venv-$n/bin/python" -I server/app.py & pid=$!
            for _ in $(seq 1 30); do
              sleep 1
              curl -fsS -o /dev/null http://127.0.0.1:8099/config && curl -fsS -o /dev/null http://127.0.0.1:8099/alerts && { rc=0; break; }
            done
            kill "$pid" 2>/dev/null; wait "$pid" 2>/dev/null
            [ "$rc" = 0 ] && echo "live service answered /config and /alerts"
            return "$rc"
          }
          # Runs started with GITHUB_TOKEN fire no workflow_run event, so the gate itself waits for
          # the reviewer and the fixer it starts, then looks at the PRs again: one gate run carries a
          # PR from failing tests through fix attempts and review to the merge.
          gh label create pipeline --color 5319e7 --description "Taken by the Agent PR gate: reviewer, fixer, gate" 2>/dev/null || true
          gh label create gate-stopped --color d93f0b --description "The Agent PR gate handed this PR back to its author" 2>/dev/null || true
          for round in 1 2 3 4 5 6 7 8; do
          echo "::notice::round $round"
          need_review=0; requeue=0; need_fix=0
          fixer_busy=$(busy pr-fixer.lock.yml)
          # "<number>:<kind>" for agent PRs, Dependabot PRs from this repo and the owners' ready PRs;
          # a PR with the label gate-stopped waits for its owner
          prs=$(gh pr list --state open --limit 100 --json number,author,isDraft,isCrossRepository,labels --jq '
                .[] | (.labels | map(.name)) as $l | select($l | index("gate-stopped") | not)
                | if (.author.login == "app/github-actions" or .author.login == "github-actions") and ($l | index("agent")) then "\(.number):agent"
                  elif (.author.login == "app/dependabot" or .author.login == "dependabot") and (.isCrossRepository | not) then "\(.number):dependabot"
                  elif (.author.login as $a | $ENV.OWNERS | split(" ") | index($a)) and (.isDraft | not) then "\(.number):owner"
                  else empty end')
          for entry in $prs; do
            n=${entry%%:*}; kind=${entry#*:}
            echo "::group::PR #$n ($kind)"
            # the label tells the reviewer and the fixer that the gate took this PR
            gh pr edit "$n" --add-label pipeline >/dev/null 2>&1 || true
            [ "$kind" = agent ] && { gh pr ready "$n" 2>/dev/null || true; }
            # CI on a PR by github-actions[bot] waits for an approval; nobody else gives it
            sha=$(gh pr view "$n" --json headRefOid --jq .headRefOid)
            gh api "repos/$GITHUB_REPOSITORY/issues/$n/comments" --paginate > "/tmp/comments-$n.json"
            # fix attempts so far (after the last stop, when an owner handed the PR back), and the
            # requests and fixer answers for this exact head
            since=$(jq -rs "add // [] | map(select($bot and (.body | startswith(\"Agent PR gate: stopped\")))) | last | .created_at // \"\"" "/tmp/comments-$n.json")
            attempts=$(jq -s --arg since "$since" "add // [] | map(select($bot and (.body | startswith(\"Agent PR gate: fix attempt\")) and (.created_at > \$since))) | length" "/tmp/comments-$n.json")
            asked=$(jq -s --arg sha "$sha" "add // [] | map(select($bot and (.body | startswith(\"Agent PR gate: fix attempt\")) and (.body | test(\"(?m)^Fix-Head: *\" + \$sha)))) | length" "/tmp/comments-$n.json")
            asked_at=$(jq -rs --arg sha "$sha" "add // [] | map(select($bot and (.body | startswith(\"Agent PR gate: fix attempt\")) and (.body | test(\"(?m)^Fix-Head: *\" + \$sha)))) | last | .created_at // \"\"" "/tmp/comments-$n.json")
            answers=$(jq -s --arg sha "$sha" "add // [] | map(select($bot and (.body | contains(\"workflow_id: pr-fixer\")) and (.body | test(\"(?m)^Head: *\" + \$sha)))) | length" "/tmp/comments-$n.json")
            jq -rs --arg sha "$sha" "add // [] | map(select($bot and (.body | contains(\"workflow_id: pr-fixer\")) and (.body | test(\"(?m)^Head: *\" + \$sha)) and (.body | test(\"(?m)^PR fixer: no fix\")))) | last | .body // \"\"" "/tmp/comments-$n.json" | tr -d '\r' > "/tmp/nofix-$n.txt"
            nofix=$(grep -c '^PR fixer: no fix' "/tmp/nofix-$n.txt" || true)
            nofix_cause=$(sed -nE 's/^Cause: *//p' "/tmp/nofix-$n.txt" | head -1)
            if [ "$asked" -gt "$answers" ] && [ "$nofix" = 0 ]; then
              # a fix was asked for this head and the fixer has not answered: wait for it, unless
              # it is idle and the request is over three hours old (then that attempt failed)
              age=$(( $(date +%s) - $(date -d "$asked_at" +%s) ))
              if [ "${fixer_busy:-0}" != 0 ] || [ "$age" -lt 10800 ]; then
                echo "waiting for the PR fixer on $sha (attempt $attempts of $MAX_FIX)"
                need_fix=1
                echo "::endgroup::"; continue
              fi
            fi
            for r in $(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$sha&status=action_required" --jq '.workflow_runs[].id'); do
              gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$r/approve" >/dev/null && echo "approved CI run $r"
            done
            files=$(gh pr diff "$n" --name-only)
            case "$kind" in
              agent)
                # the security-fixer also fixes CodeQL alerts in the vendored gh-cao dashboard: known by
                # the footer gh-aw appends to the PR body, never by the title the agent writes (#164)
                gh pr view "$n" --json body --jq .body > "/tmp/body-$n.md"
                bad=$(echo "$files" | python3 -I scripts/gate_rules.py bad-files --body-file "/tmp/body-$n.md" \
                      --allowed "$ALLOWED" --security "$SECURITY_ALLOWED") || bad="(the path check failed)"
                if [ -n "$bad" ]; then
                  request_fix "It changes files outside the allowed paths: $(echo $bad). Revert them."
                  echo "::endgroup::"; continue
                fi
                # the Workflow maintainer's script runs with the deploy key: only Casper or the owner changes it
                if echo "$files" | grep -qx 'scripts/workflow_change\.py'; then
                  request_fix "It changes scripts/workflow_change.py, the Workflow maintainer's script, which runs with the deploy key and is pinned by hash in workflow-maintainer.yml; only Casper or the owner changes it. Revert it."
                  echo "::endgroup::"; continue
                fi
                # the gate's own rules (paths by footer, the reviewer's verdict): only Casper or the owner changes them
                if echo "$files" | grep -qx 'scripts/gate_rules\.py'; then
                  request_fix "It changes scripts/gate_rules.py, the rules this gate merges by; only Casper or the owner changes it. Revert it."
                  echo "::endgroup::"; continue
                fi;;
              dependabot)
                bad=$(echo "$files" | grep -Ev "$DEPENDABOT_ALLOWED" || true)
                if [ -n "$bad" ]; then
                  close_pr "A Dependabot PR may change only server/requirements*.txt; this one changes $(echo $bad)."
                  echo "::endgroup::"; continue
                fi;;
              owner)
                bad=$(echo "$files" | grep -E "$OWNER_FORBIDDEN" || true)
                if [ -n "$bad" ]; then
                  stop_pr "It changes $(echo $bad); the gate's GITHUB_TOKEN cannot merge workflow files, so merge it yourself."
                  echo "::endgroup::"; continue
                fi;;
            esac
            git checkout -q --detach
            gh pr checkout "$n" --force
            ok=1; log="/tmp/gate-log-$n.txt"; : > "$log"
            { python3 -I -m unittest discover -s tests 2>&1 || { ok=0; echo "FAILED: unit tests"; }; } | tee -a "$log"
            { python3 -I scripts/rcb.py update --pages 1 --out /tmp/gate-$n 2>&1 || { ok=0; echo "FAILED: live parse of gov.pl"; }; } | tee -a "$log"
            for js in docs/*.js; do { node --check "$js" 2>&1 || { ok=0; echo "FAILED: node --check $js"; }; } | tee -a "$log"; done
            { npx --yes html-validate@9.7.1 --config .htmlvalidate.json docs/*.html 2>&1 || { ok=0; echo "FAILED: html-validate docs/*.html"; }; } | tee -a "$log"
            { pipx run "$RUFF" check . 2>&1 || { ok=0; echo "FAILED: ruff check ."; }; } | tee -a "$log"
            { { npm install --no-save --no-package-lock --no-audit --no-fund --silent $ESLINT && npx --no-install eslint .; } 2>&1 || { ok=0; echo "FAILED: eslint ."; }; } | tee -a "$log"
            if echo "$files" | grep -q '^server/'; then
              # the live service (server/) is deployed from main by casper-infra: it must install and start
              { live_check 2>&1 || { ok=0; echo "FAILED: live service start (server/)"; }; } | tee -a "$log"
            fi
            grep -q '^FAILED: ' "$log" && ok=0
            git checkout -q main
            if [ "$ok" != 1 ]; then
              request_fix "$(grep '^FAILED: ' "$log" | sed 's/^FAILED: //' | paste -sd, - | sed 's/,/, /g') failed on $sha (gate run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)." "$log"
              echo "::endgroup::"; continue
            fi
            # CodeQL on this head (codeql.yml, with the repository's own queries in codeql/): GitHub's check
            # "CodeQL" fails when the PR adds an alert, and the ruleset "CodeQL: no new alerts" then refuses
            # the merge. A new alert goes to the fixer; an analysis still running waits for the next round.
            # The check says "neutral" while the Analyze jobs still run (seen on PR #174), so it counts
            # only once every codeql.yml run on this head has completed.
            cqbusy=$(gh run list --workflow codeql.yml --commit "$sha" --limit 20 --json status \
                     --jq 'if length == 0 then "none" else ([.[] | select(.status != "completed")] | length | tostring) end' 2>/dev/null || echo none)
            if [ "$cqbusy" != 0 ]; then
              echo "CodeQL has not finished on $sha (runs not completed: $cqbusy): the next round looks again"
              echo "::endgroup::"; continue
            fi
            cq=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs?check_name=CodeQL&per_page=20" \
                 --jq '[.check_runs[] | select(.app.slug == "github-advanced-security") | (.conclusion // .status)][0] // "none"' 2>/dev/null || echo none)
            case "$cq" in
              success|neutral|skipped) echo "CodeQL: no new alert on $sha";;
              failure|action_required)
                alerts=$(gh api "repos/$GITHUB_REPOSITORY/code-scanning/alerts?ref=refs/pull/$n/merge&state=open&per_page=20" \
                  --jq '.[] | "\(.rule.id) at \(.most_recent_instance.location.path):\(.most_recent_instance.location.start_line)"' 2>/dev/null | paste -sd';' - | sed 's/;/; /g')
                request_fix "CodeQL found new alerts on $sha: ${alerts:-see the CodeQL check of the PR}. Fix the code; never dismiss an alert or exclude a path to pass."
                echo "::endgroup::"; continue;;
              *)
                echo "CodeQL has not finished on $sha ($cq): the next round looks again"
                echo "::endgroup::"; continue;;
            esac
            mergeable() {  # GitHub computes it lazily: ask again while it says UNKNOWN
              local m
              for _ in 1 2 3 4 5 6; do
                m=$(gh pr view "$n" --json mergeable --jq .mergeable)
                [ "$m" != UNKNOWN ] && break
                sleep 5
              done
              echo "$m"
            }
            if [ "$(mergeable)" = CONFLICTING ]; then
              request_fix "It conflicts with main: merge origin/main into the branch and resolve the conflict."
              echo "::endgroup::"; continue
            fi
            # the PR reviewer's verdict on this exact head: a PR review (only the pr-reviewer workflow can
            # submit one), never a comment, which any agent can write with the reviewer's footer (#165)
            gh api "repos/$GITHUB_REPOSITORY/pulls/$n/reviews?per_page=100" --paginate > "/tmp/reviews-$n.json"
            python3 -I scripts/gate_rules.py verdict --reviews-file "/tmp/reviews-$n.json" --sha "$sha" > "/tmp/verdict-$n.txt" || : > "/tmp/verdict-$n.txt"
            verdict=$(cut -f1 "/tmp/verdict-$n.txt")
            reason=$(cut -f2- "/tmp/verdict-$n.txt")
            if [ -z "$verdict" ]; then
              echo "tests pass; no reviewer verdict for $sha yet"
              need_review=1
              echo "::endgroup::"; continue
            fi
            if [ "$verdict" = reject ]; then
              close_pr "The PR reviewer rejected it on substance: ${reason:-see its comment}"
              echo "::endgroup::"; continue
            fi
            if [ "$verdict" = changes ]; then
              request_fix "The PR reviewer asked for changes: ${reason:-see its comment}"
              echo "::endgroup::"; continue
            fi
            # the squash commit lands on main, so its subject must be a Conventional Commit
            title=$(gh pr view "$n" --json title --jq .title)
            agent=$(printf '%s' "$title" | sed -nE 's/^\[([a-z0-9-]+)\] .*/\1/p')
            subject=$(printf '%s' "$title" | sed -E 's/^\[[a-z0-9-]+\] //')
            if ! python3 -I scripts/changelog.py lint --title "$subject" 2>/dev/null; then
              case "$agent" in
                site-fixer) type="fix(site)";; site-designer) type="feat(site)";;
                parser-doctor) type="fix(parser)";; region-keeper) type="fix(regions)";;
                security-auditor|security-fixer) type="fix(security)";; test-improver) type="test";;
                docs-keeper) type="docs";; process-retro|process-doctor) type="chore(process)";; issue-worker) type="fix";; *) type="chore";;
              esac
              subject="$type: $subject"
            fi
            closes=$(gh pr view "$n" --json closingIssuesReferences --jq '.closingIssuesReferences[].number')
            # the squash body is the PR's commit messages without AI co-author lines (owner's rule, 2026-11-23)
            body=$(gh pr view "$n" --json commits --jq '.commits[] | "* " + .messageHeadline + (if .messageBody != "" then "\n\n" + .messageBody else "" end) + "\n"' \
              | grep -viE '^co-authored-by:.*(claude|anthropic)|generated with .*claude' || true)
            if gh pr merge "$n" --squash --delete-branch --subject "$subject (#$n)" --body "${body:-Merged by the Agent PR gate.}" --match-head-commit "$sha"; then
              echo "merged #$n: $subject"
              gh pr comment "$n" --body "Agent PR gate: merged. Tests passed and the PR reviewer approved $sha: ${reason:-see its comment}"
              # a merge made with GITHUB_TOKEN does not apply "Closes #N"; do it here
              for i in $closes; do
                gh issue close "$i" --reason completed --comment "Fixed by #$n, merged by the Agent PR gate." && echo "closed #$i"
              done
            elif [ "$(mergeable)" = CONFLICTING ]; then
              request_fix "It conflicts with main: merge origin/main into the branch and resolve the conflict."
            else
              echo "merge of #$n failed; the next round tries again"
            fi
            echo "::endgroup::"
          done
          if [ "$need_review" = 1 ]; then
            busy=$(gh run list --workflow pr-reviewer.lock.yml --limit 10 --json status --jq '[.[] | select(.status != "completed")] | length')
            if [ "$(refused pr-reviewer.lock.yml)" = 1 ]; then
              echo "the last two PR reviewer runs failed in under 8 minutes (the provider refused them?): not starting another"
              need_review=0
            elif [ "${busy:-0}" = 0 ]; then
              gh workflow run pr-reviewer.lock.yml && echo "started the PR reviewer"
            else
              echo "the PR reviewer is already running"
            fi
          fi
          if [ "$need_fix" = 1 ]; then
            if [ "$(refused pr-fixer.lock.yml)" = 1 ]; then
              echo "the last two PR fixer runs failed in under 8 minutes (the provider refused them?): not starting another"
              need_fix=0
            elif [ "${fixer_busy:-0}" = 0 ]; then
              gh workflow run pr-fixer.lock.yml && echo "started the PR fixer"
            else
              echo "the PR fixer is already running"
            fi
          fi
          if [ "$requeue" = 1 ]; then
            gh workflow run issue-worker.lock.yml && echo "started the issue-worker for the returned issues"
          fi
          [ "$need_review" = 1 ] || [ "$need_fix" = 1 ] || break
          # wait (up to 40 minutes) until the reviewer and the fixer are idle, then look again
          sleep 30
          for _ in $(seq 1 80); do
            [ "$(busy pr-reviewer.lock.yml)" = 0 ] && [ "$(busy pr-fixer.lock.yml)" = 0 ] && break
            sleep 30
          done
          done
