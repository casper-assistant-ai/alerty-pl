name: Agent PR gate

# No humans in the loop: agent PRs are merged or closed by this gate, never left for a person.
# A PR is merged only when (1) a gh-aw agent opened it, (2) it touches allowed paths only,
# (3) unit tests, a live parse of gov.pl and node --check pass on its head, (4) it merges into main
# cleanly, and (5) the PR reviewer agent approved that same head. When (2), (3) or (4) fails, or the
# reviewer says "Verdict: changes", the gate asks the PR fixer agent to fix the PR in its own branch
# ("Agent PR gate: fix attempt k of 3", with the reason and the test log) and tests the new head
# again. It closes a PR only when the reviewer rejects it on substance, the fixer finds it cannot be
# fixed, or three fix attempts did not help; then it tells the linked issues and starts the
# issue-worker, which takes them again (and gives up after two closed PRs).
on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_run:
    workflows: ["PR reviewer", "PR fixer"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write
  issues: write

concurrency:
  group: agent-pr-gate

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      ALLOWED: '^(scripts/|tests/|process/[a-z0-9-]+\.(md|json)$|docs/[a-z0-9-]+\.(html|js|css)$|README\.md$|AGENTS\.md$)'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge or close agent PRs
        run: |
          set -u
          git config user.name "alerty-pl bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          MAX_FIX=3
          busy() { gh run list --workflow "$1" --limit 10 --json status --jq '[.[] | select(.status != "completed")] | length'; }
          bot='.user.login=="github-actions[bot]"'
          close_pr() {  # $1: the reason, quoted on the PR and on its linked issues
            local closes
            closes=$(gh pr view "$n" --json closingIssuesReferences --jq '.closingIssuesReferences[].number')
            gh pr close "$n" --delete-branch --comment "Agent PR gate: closed without merging. $1" && echo "closed #$n: $1"
            for i in $closes; do
              gh issue comment "$i" --body "Agent PR gate: #$n was closed without merging. $1 The issue-worker takes this issue again."
            done
            requeue=1
          }
          request_fix() {  # $1: the reason; $2: a log file whose end goes into the request
            local k body
            if [ "$nofix" -gt 0 ]; then
              close_pr "$1 The PR fixer found it cannot be fixed in this branch: ${nofix_cause:-see its comment}"; return
            fi
            if [ "$attempts" -ge "$MAX_FIX" ]; then
              close_pr "$1 It still fails after $MAX_FIX fix attempts by the PR fixer."; return
            fi
            k=$((attempts + 1))
            body="/tmp/fix-$n.md"
            { echo "Agent PR gate: fix attempt $k of $MAX_FIX"
              echo "Fix-Head: $sha"
              echo
              echo "Reason: $1"
              echo
              echo "The PR fixer agent fixes this in the PR's own branch; the gate then tests the new head again."
              if [ -n "${2:-}" ] && [ -s "$2" ]; then
                echo; echo "<details><summary>end of the log</summary>"; echo; echo '```text'
                tail -n 60 "$2" | sed 's/```/` ` `/g'; echo '```'; echo; echo "</details>"
              fi
            } > "$body"
            gh pr comment "$n" --body-file "$body" && echo "fix attempt $k requested for #$n: $1"
            need_fix=1
          }
          # Runs started with GITHUB_TOKEN fire no workflow_run event, so the gate itself waits for
          # the reviewer and the fixer it starts, then looks at the PRs again: one gate run carries a
          # PR from failing tests through fix attempts and review to the merge.
          for round in 1 2 3 4 5 6 7 8; do
          echo "::notice::round $round"
          need_review=0; requeue=0; need_fix=0
          fixer_busy=$(busy pr-fixer.lock.yml)
          prs=$(gh pr list --state open --label agent --json number,author,isDraft \
                --jq '.[] | select(.author.login=="app/github-actions" or .author.login=="github-actions") | .number')
          for n in $prs; do
            echo "::group::PR #$n"
            gh pr ready "$n" 2>/dev/null || true
            # CI on a PR by github-actions[bot] waits for an approval; nobody else gives it
            sha=$(gh pr view "$n" --json headRefOid --jq .headRefOid)
            gh api "repos/$GITHUB_REPOSITORY/issues/$n/comments" --paginate > "/tmp/comments-$n.json"
            # fix attempts so far, and the requests and fixer answers for this exact head
            attempts=$(jq -s "add // [] | map(select($bot and (.body | startswith(\"Agent PR gate: fix attempt\")))) | length" "/tmp/comments-$n.json")
            asked=$(jq -s --arg sha "$sha" "add // [] | map(select($bot and (.body | startswith(\"Agent PR gate: fix attempt\")) and (.body | test(\"(?m)^Fix-Head: *\" + \$sha)))) | length" "/tmp/comments-$n.json")
            asked_at=$(jq -rs --arg sha "$sha" "add // [] | map(select($bot and (.body | startswith(\"Agent PR gate: fix attempt\")) and (.body | test(\"(?m)^Fix-Head: *\" + \$sha)))) | last | .created_at // \"\"" "/tmp/comments-$n.json")
            answers=$(jq -s --arg sha "$sha" "add // [] | map(select($bot and (.body | contains(\"workflow_id: pr-fixer\")) and (.body | test(\"(?m)^Head: *\" + \$sha)))) | length" "/tmp/comments-$n.json")
            jq -rs --arg sha "$sha" "add // [] | map(select($bot and (.body | contains(\"workflow_id: pr-fixer\")) and (.body | test(\"(?m)^Head: *\" + \$sha)) and (.body | test(\"(?m)^PR fixer: no fix\")))) | last | .body // \"\"" "/tmp/comments-$n.json" | tr -d '\r' > "/tmp/nofix-$n.txt"
            nofix=$(grep -c '^PR fixer: no fix' "/tmp/nofix-$n.txt" || true)
            nofix_cause=$(sed -nE 's/^Cause: *//p' "/tmp/nofix-$n.txt" | head -1)
            if [ "$asked" -gt "$answers" ] && [ "$nofix" = 0 ]; then
              # a fix was asked for this head and the fixer has not answered: wait for it, unless
              # it is idle and the request is over three hours old (then that attempt failed)
              age=$(( $(date +%s) - $(date -d "$asked_at" +%s) ))
              if [ "${fixer_busy:-0}" != 0 ] || [ "$age" -lt 10800 ]; then
                echo "waiting for the PR fixer on $sha (attempt $attempts of $MAX_FIX)"
                need_fix=1
                echo "::endgroup::"; continue
              fi
            fi
            for r in $(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$sha&status=action_required" --jq '.workflow_runs[].id'); do
              gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$r/approve" >/dev/null && echo "approved CI run $r"
            done
            files=$(gh pr diff "$n" --name-only)
            bad=$(echo "$files" | grep -Ev "$ALLOWED" || true)
            if [ -n "$bad" ]; then
              request_fix "It changes files outside the allowed paths: $(echo $bad). Revert them."
              echo "::endgroup::"; continue
            fi
            git checkout -q --detach
            gh pr checkout "$n" --force
            ok=1; log="/tmp/gate-log-$n.txt"; : > "$log"
            { python3 -I -m unittest discover -s tests 2>&1 || { ok=0; echo "FAILED: unit tests"; }; } | tee -a "$log"
            { python3 -I scripts/rcb.py update --pages 1 --out /tmp/gate-$n 2>&1 || { ok=0; echo "FAILED: live parse of gov.pl"; }; } | tee -a "$log"
            for js in docs/*.js; do { node --check "$js" 2>&1 || { ok=0; echo "FAILED: node --check $js"; }; } | tee -a "$log"; done
            grep -q '^FAILED: ' "$log" && ok=0
            git checkout -q main
            if [ "$ok" != 1 ]; then
              request_fix "$(grep '^FAILED: ' "$log" | sed 's/^FAILED: //' | paste -sd, - | sed 's/,/, /g') failed on $sha (gate run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)." "$log"
              echo "::endgroup::"; continue
            fi
            if [ "$(gh pr view "$n" --json mergeable --jq .mergeable)" = CONFLICTING ]; then
              request_fix "It conflicts with main: merge origin/main into the branch and resolve the conflict."
              echo "::endgroup::"; continue
            fi
            # the PR reviewer's verdict on this exact head (its comments carry gh-aw's workflow_id footer)
            jq -rs --arg sha "$sha" 'add // [] | map(select(.user.login=="github-actions[bot]"
                  and (.body | contains("workflow_id: pr-reviewer"))
                  and (.body | test("(?m)^Head: *" + $sha)))) | last | .body // ""' "/tmp/comments-$n.json" \
              | tr -d '\r' > "/tmp/verdict-$n.txt"
            verdict=$(sed -nE 's/^Verdict: *(approve|changes|reject).*/\1/p' "/tmp/verdict-$n.txt" | head -1)
            reason=$(sed -nE 's/^Reason: *//p' "/tmp/verdict-$n.txt" | head -1)
            if [ -z "$verdict" ]; then
              echo "tests pass; no reviewer verdict for $sha yet"
              need_review=1
              echo "::endgroup::"; continue
            fi
            if [ "$verdict" = reject ]; then
              close_pr "The PR reviewer rejected it on substance: ${reason:-see its comment}"
              echo "::endgroup::"; continue
            fi
            if [ "$verdict" = changes ]; then
              request_fix "The PR reviewer asked for changes: ${reason:-see its comment}"
              echo "::endgroup::"; continue
            fi
            # the squash commit lands on main, so its subject must be a Conventional Commit
            title=$(gh pr view "$n" --json title --jq .title)
            agent=$(printf '%s' "$title" | sed -nE 's/^\[([a-z0-9-]+)\] .*/\1/p')
            subject=$(printf '%s' "$title" | sed -E 's/^\[[a-z0-9-]+\] //')
            if ! python3 -I scripts/changelog.py lint --title "$subject" 2>/dev/null; then
              case "$agent" in
                site-fixer) type="fix(site)";; site-designer) type="feat(site)";;
                parser-doctor) type="fix(parser)";; region-keeper) type="fix(regions)";;
                security-auditor) type="fix(security)";; test-improver) type="test";;
                docs-keeper) type="docs";; process-retro) type="chore(process)";; issue-worker) type="fix";; *) type="chore";;
              esac
              subject="$type: $subject"
            fi
            closes=$(gh pr view "$n" --json closingIssuesReferences --jq '.closingIssuesReferences[].number')
            if gh pr merge "$n" --squash --delete-branch --subject "$subject (#$n)" --match-head-commit "$sha"; then
              echo "merged #$n: $subject"
              gh pr comment "$n" --body "Agent PR gate: merged. Tests passed and the PR reviewer approved $sha: ${reason:-see its comment}"
              # a merge made with GITHUB_TOKEN does not apply "Closes #N"; do it here
              for i in $closes; do
                gh issue close "$i" --reason completed --comment "Fixed by #$n, merged by the Agent PR gate." && echo "closed #$i"
              done
            fi
            echo "::endgroup::"
          done
          if [ "$need_review" = 1 ]; then
            busy=$(gh run list --workflow pr-reviewer.lock.yml --limit 10 --json status --jq '[.[] | select(.status != "completed")] | length')
            if [ "${busy:-0}" = 0 ]; then
              gh workflow run pr-reviewer.lock.yml && echo "started the PR reviewer"
            else
              echo "the PR reviewer is already running"
            fi
          fi
          if [ "$need_fix" = 1 ]; then
            if [ "${fixer_busy:-0}" = 0 ]; then
              gh workflow run pr-fixer.lock.yml && echo "started the PR fixer"
            else
              echo "the PR fixer is already running"
            fi
          fi
          if [ "$requeue" = 1 ]; then
            gh workflow run issue-worker.lock.yml && echo "started the issue-worker for the returned issues"
          fi
          [ "$need_review" = 1 ] || [ "$need_fix" = 1 ] || break
          # wait (up to 40 minutes) until the reviewer and the fixer are idle, then look again
          sleep 30
          for _ in $(seq 1 80); do
            [ "$(busy pr-reviewer.lock.yml)" = 0 ] && [ "$(busy pr-fixer.lock.yml)" = 0 ] && break
            sleep 30
          done
          done
