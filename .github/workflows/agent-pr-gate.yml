name: Agent PR gate

# No humans in the loop: agent PRs are merged or closed by this gate, never left for a person.
# A PR is merged only when (1) a gh-aw agent opened it, (2) it touches allowed paths only,
# (3) unit tests, a live parse of gov.pl and node --check pass on its head, and (4) the PR reviewer
# agent approved that same head. Otherwise the gate closes it with the reason, tells its linked
# issues, and starts the issue-worker, which takes them again (and gives up after two rejections).
on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_run:
    workflows: ["PR reviewer"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write
  issues: write

concurrency:
  group: agent-pr-gate

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      ALLOWED: '^(scripts/|tests/|process/[a-z0-9-]+\.(md|json)$|docs/[a-z0-9-]+\.(html|js|css)$|README\.md$|AGENTS\.md$)'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge or close agent PRs
        run: |
          set -u
          git config user.name "alerty-pl bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          need_review=0; requeue=0
          close_pr() {  # $1: the reason, quoted on the PR and on its linked issues
            local closes
            closes=$(gh pr view "$n" --json closingIssuesReferences --jq '.closingIssuesReferences[].number')
            gh pr close "$n" --delete-branch --comment "Agent PR gate: closed without merging. $1" && echo "closed #$n: $1"
            for i in $closes; do
              gh issue comment "$i" --body "Agent PR gate: #$n was closed without merging. $1 The issue-worker takes this issue again."
            done
            requeue=1
          }
          prs=$(gh pr list --state open --label agent --json number,author,isDraft \
                --jq '.[] | select(.author.login=="app/github-actions" or .author.login=="github-actions") | .number')
          for n in $prs; do
            echo "::group::PR #$n"
            gh pr ready "$n" 2>/dev/null || true
            # CI on a PR by github-actions[bot] waits for an approval; nobody else gives it
            sha=$(gh pr view "$n" --json headRefOid --jq .headRefOid)
            for r in $(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$sha&status=action_required" --jq '.workflow_runs[].id'); do
              gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$r/approve" >/dev/null && echo "approved CI run $r"
            done
            files=$(gh pr diff "$n" --name-only)
            bad=$(echo "$files" | grep -Ev "$ALLOWED" || true)
            if [ -n "$bad" ]; then
              close_pr "It changes files outside the allowed paths: $(echo $bad)."
              echo "::endgroup::"; continue
            fi
            git checkout -q --detach
            gh pr checkout "$n" --force
            ok=1
            python3 -I -m unittest discover -s tests || ok=0
            python3 -I scripts/rcb.py update --pages 1 --out /tmp/gate-$n || ok=0
            for js in docs/*.js; do node --check "$js" || ok=0; done
            git checkout -q main
            if [ "$ok" != 1 ]; then
              close_pr "Unit tests, the live parse of gov.pl or node --check failed on $sha (see this gate run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
              echo "::endgroup::"; continue
            fi
            # the PR reviewer's verdict on this exact head (its comments carry gh-aw's workflow_id footer)
            gh api "repos/$GITHUB_REPOSITORY/issues/$n/comments" --paginate > "/tmp/comments-$n.json"
            jq -rs --arg sha "$sha" 'add // [] | map(select(.user.login=="github-actions[bot]"
                  and (.body | contains("workflow_id: pr-reviewer"))
                  and (.body | test("(?m)^Head: *" + $sha)))) | last | .body // ""' "/tmp/comments-$n.json" \
              | tr -d '\r' > "/tmp/verdict-$n.txt"
            verdict=$(sed -nE 's/^Verdict: *(approve|reject).*/\1/p' "/tmp/verdict-$n.txt" | head -1)
            reason=$(sed -nE 's/^Reason: *//p' "/tmp/verdict-$n.txt" | head -1)
            if [ -z "$verdict" ]; then
              echo "tests pass; no reviewer verdict for $sha yet"
              need_review=1
              echo "::endgroup::"; continue
            fi
            if [ "$verdict" = reject ]; then
              close_pr "The PR reviewer rejected it: ${reason:-see its comment}"
              echo "::endgroup::"; continue
            fi
            # the squash commit lands on main, so its subject must be a Conventional Commit
            title=$(gh pr view "$n" --json title --jq .title)
            agent=$(printf '%s' "$title" | sed -nE 's/^\[([a-z0-9-]+)\] .*/\1/p')
            subject=$(printf '%s' "$title" | sed -E 's/^\[[a-z0-9-]+\] //')
            if ! python3 -I scripts/changelog.py lint --title "$subject" 2>/dev/null; then
              case "$agent" in
                site-fixer) type="fix(site)";; site-designer) type="feat(site)";;
                parser-doctor) type="fix(parser)";; region-keeper) type="fix(regions)";;
                security-auditor) type="fix(security)";; test-improver) type="test";;
                docs-keeper) type="docs";; process-retro) type="chore(process)";; issue-worker) type="fix";; *) type="chore";;
              esac
              subject="$type: $subject"
            fi
            closes=$(gh pr view "$n" --json closingIssuesReferences --jq '.closingIssuesReferences[].number')
            if gh pr merge "$n" --squash --delete-branch --subject "$subject (#$n)" --match-head-commit "$sha"; then
              echo "merged #$n: $subject"
              gh pr comment "$n" --body "Agent PR gate: merged. Tests passed and the PR reviewer approved $sha: ${reason:-see its comment}"
              # a merge made with GITHUB_TOKEN does not apply "Closes #N"; do it here
              for i in $closes; do
                gh issue close "$i" --reason completed --comment "Fixed by #$n, merged by the Agent PR gate." && echo "closed #$i"
              done
            fi
            echo "::endgroup::"
          done
          if [ "$need_review" = 1 ]; then
            busy=$(gh run list --workflow pr-reviewer.lock.yml --limit 10 --json status --jq '[.[] | select(.status != "completed")] | length')
            if [ "${busy:-0}" = 0 ]; then
              gh workflow run pr-reviewer.lock.yml && echo "started the PR reviewer"
            else
              echo "the PR reviewer is already running"
            fi
          fi
          if [ "$requeue" = 1 ]; then
            gh workflow run issue-worker.lock.yml && echo "started the issue-worker for the returned issues"
          fi
