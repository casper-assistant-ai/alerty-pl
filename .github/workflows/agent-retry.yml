# Agent retry: starts again an agent run that z.ai stopped (429 quota or rate limit, 529 overload), so
# its work does not wait for the next schedule (scripts/agent_retry.py). 10 minutes after the failure,
# or one minute after the 5-hour quota resets; at most three attempts per run, never when the agent
# already sent a PR, an issue or a closing. A failed agent run starts it through workflow_run and the
# job waits for the retry that is due (up to 45 minutes); the schedule catches what the events miss
# (reruns made with GITHUB_TOKEN fire no workflow_run, and GitHub skips schedules for hours at times).
name: Agent retry

on:
  workflow_run:
    workflows: ["Agent coach", "CI doctor", "Daily status", "Docs keeper", "Issue triage", "Issue worker", "PR fixer", "PR reviewer", "Parser doctor", "Process doctor", "Process retro", "Region keeper", "Security auditor", "Security fixer", "Site designer", "Site fixer", "Test improver"]
    types: [completed]
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List the retries without starting them"
        type: boolean
        default: true

permissions:
  # write: it re-runs failed agent runs
  actions: write
  contents: read

concurrency:
  group: agent-retry
  cancel-in-progress: false

jobs:
  retry:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/agent_retry.py
            scripts/agent_failures.py
            .github/workflows
      - name: Re-run agent runs stopped by the model provider
        run: python3 -I scripts/agent_retry.py --watch 45 ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '--dry-run' || '' }}
